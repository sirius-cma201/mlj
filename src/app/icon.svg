<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Plate Gradient -->
    <linearGradient id="aj-bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Cyber Cyan Neon Gradient -->
    <linearGradient id="aj-cyan-grad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Arc Reactor Glow Filter -->
    <filter id="aj-core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Precision Hexagonal Hull / Dark Shield -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    fill="url(#aj-bg-grad)"
    stroke="url(#aj-cyan-grad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Reactor Hex Outline -->
  <polygon
    points="32,8 52,20 52,44 32,56 12,44 12,20"
    fill="none"
    stroke="#22d3ee"
    stroke-opacity="0.25"
    stroke-width="1"
    stroke-dasharray="3 3"
  />

  <!-- Corner Arc Reactor Telemetry Nodes -->
  <circle cx="32" cy="4" r="2" fill="#67e8f9" />
  <circle cx="56" cy="18" r="2" fill="#22d3ee" />
  <circle cx="56" cy="46" r="2" fill="#06b6d4" />
  <circle cx="32" cy="60" r="2" fill="#06b6d4" />
  <circle cx="8" cy="46" r="2" fill="#0891b2" />
  <circle cx="8" cy="18" r="2" fill="#22d3ee" />

  <!-- Monogram Glyph: 'A' Left Apex Stroke -->
  <line
    x1="19"
    y1="45"
    x2="32"
    y2="16"
    stroke="#f8fafc"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- 'A' Right Apex Stroke -->
  <path
    d="M 32 16 L 45 45"
    stroke="url(#aj-cyan-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 'A' Horizontal Bridge -->
  <line
    x1="24.5"
    y1="34"
    x2="39.5"
    y2="34"
    stroke="#22d3ee"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- 'J' Dynamic Curvature -->
  <path
    d="M 37 26 V 41 C 37 47 32 49 27 49 C 23 49 20 47 18.5 44"
    stroke="url(#aj-cyan-grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Arc Reactor Core Node -->
  <circle cx="32" cy="25" r="4" fill="#22d3ee" opacity="0.4" filter="url(#aj-core-glow)" />
  <circle cx="32" cy="25" r="2" fill="#ffffff" />
</svg>
